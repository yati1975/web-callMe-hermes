  <title>取號系統</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      overflow: hidden; /* 整個頁面禁止滾動 */
      background: #fff;
      color: #222;
      font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        "PingFang TC",
        sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;

    }

    /* =========================
       主容器
    ========================= */

    .queue-page {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      max-height: 100dvh;
      padding: 12px 20px;
      position: relative;
      display: grid;

      /*
      * 標題
      * Section A
      * Section B
      * Section C
      * Notice
      */
      grid-template-rows:
        auto
        1fr
        auto;
      overflow: hidden;
      justify-items: center;
    }


    /* =========================
       頂部標題
    ========================= */

    .page-title {
      margin: 0 0 4px;
      padding-bottom: 6px;
      text-align: center;
      font-size: clamp(18px, 5vw, 24px);
      font-weight: 300;
      letter-spacing: 2px;
      color: #666;
      width: 100%;
      border-bottom: 1px solid #e5e5e5;
      flex-shrink: 0;
    }

    .queue-section {
      width: 100%;
      max-width: 430px;
      /* height: 100dvh; */
      max-height: 100dvh;
      /* padding: 12px 20px; */
      position: relative;
      display: grid;
      grid-template-rows:
        1fr
        1fr
        1fr;
      overflow: hidden;
    }

    /* =========================
       取號區塊
    ========================= */




    .queue-item {
      min-height: 0;
      padding: clamp(8px, 2vh, 20px) 0;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .queue-item:last-of-type {
      border-bottom: none;
    }


    /* =========================
       類別名稱
    ========================= */

    .queue-name {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: clamp(6px, 2vw, 12px);
      margin-bottom: clamp(8px, 2vh, 18px);
      white-space: nowrap;
      max-width: 100%;
    }

    .queue-name .name-cn {
      font-size: clamp(20px, 6vw, 28px);
      font-weight: 300;
      color: #222;
    }

    .queue-name .name-en {
      font-size: clamp(15px, 4.5vw, 21px);
      font-weight: 300;
      color: #333;
    }


    /* =========================
       取號按鈕
    ========================= */
    .queue-button-group {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 5vw;
    }
    .queue-label {
      display: flex;           /* 🛠️ 1. 改為 flex 佈局 */
      justify-content: center; /* 🛠️ 2. 水平置中 */
      align-items: center;     /* 🛠️ 3. 垂直置中 */
      width: min(150px, 45vw);
      height: clamp(42px, 7vh, 56px);
      margin: 0 auto clamp(8px, 2vh, 20px);
      border-radius: 5px;
      font-family: inherit;
      font-size: clamp(20px, 6vw, 27px);
      font-weight: 600;
      /* cursor: pointer; */
      flex-shrink: 0;
      background: #ffad7b;
      border: 1px solid #f39b67;
      color: #111;
      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.15);
      /* transition:
        transform 0.1s ease,
        opacity 0.1s ease; */
      text-align: center;
    }    
    .queue-button {
      display: block;
      width: min(150px, 45vw);
      height: clamp(42px, 7vh, 56px);
      margin: 0 auto clamp(8px, 2vh, 20px);
      border-radius: 5px;
      font-family: inherit;
      font-size: clamp(20px, 6vw, 27px);
      /* font-weight: 600; */
      cursor: pointer;
      flex-shrink: 0;
      transition:
        transform 0.1s ease,
        opacity 0.1s ease;
    }

    .queue-button:active {
      transform: scale(0.97);
    }

    
    /* 已經取號 / 不可取號 */

    .queue-button.disabled {
      background: #BDC3C8;
      border: 1px solid #bec3c9;
      color: #707070;
      cursor: default;
      pointer-events: none; 
      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.15);
    }

    

    /* 可以取號 */
    .queue-button.available {      
      background: #dce5ed;
      border: 1px solid #cbd6df;
      color: black;
      cursor: pointer;
      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.08);
    }


    /* =========================
       底部資訊
    ========================= */

    .queue-info {
      display: flex;

      justify-content: center;
      align-items: baseline;

      width: 100%;

      flex-shrink: 0;
    }

    .info-block {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 50%;
      white-space: nowrap;
      min-width: 0;
    }

    .info-label {
      font-size: clamp(11px, 3.5vw, 16px);
      font-weight: 300;

      color: #333;

      margin-right: 4px;
    }

    .info-value {
      font-size: clamp(18px, 6vw, 26px);

      font-weight: 300;

      color: #222;
    }


    /* =========================
       注意事項
    ========================= */

    .notice {
      position: static;
      width: 100%;
      padding: 8px 0 0;
      border-top: 1px solid #ddd;
      font-size: clamp(8px, 2.5vw, 11px);
      line-height: 1.5;
      font-weight: 300;
      color: #444;
      overflow: hidden;
    }

    .notice p {
      margin: 0;
    }

    /* 頁腳樣式 */
    .footerLogoVer {
      padding: 0;

      width: 100%;

      display: flex;

      align-items: center;

      flex-direction: column;
    }

    #ver {
      font-size: 0.7rem;
    }

    /* 背景遮罩 */
    .overlay {
      display: none; /* 初始隱藏 */
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.5); 
      z-index: 999;
      justify-content: center;
      align-items: center;
    }
    .overlay.active {
        display: flex;
    }
    /* 浮動視窗樣式 */
    .modal {
      background-color: #f2f2f2;
      position: relative;
      padding: 20px;
      width: 100%;
      max-width: 500px;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      text-align: center;
      display: flex;
      justify-content: center;
      min-height: 50vh;
      align-items: center;
    }
    .modal-box {
      display: grid;
      position: relative;
      width: 100%;
      /* max-width: 300px; */
      padding: 10px;
      /* border-bottom: 1px solid #eee; */
      box-sizing: border-box;
      color: black;
      height: auto;
      /* min-height: 140px; */
      /* font-size: 2rem; */
    }
    .modal-name {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: clamp(6px, 3vw, 12px);
      margin-bottom: clamp(15px, 5vh, 40px);
      white-space: nowrap;
      max-width: 100%;
    }

    .modal-name .modalname-cn {
      font-size: clamp(20px, 9vw, 40px);
      font-weight: 300;
      color: #222;
    }

    .modal-name .modalname-en {
      font-size: clamp(15px, 7vw, 30px);
      font-weight: 100;
      color: #333;
    }    
    .modal-msg {
      font-size: clamp(15px, 7vw, 30px);
      font-weight: 300;
      color: black;
    }
    
    /* 浮動視窗外部的關閉按鈕 */
    .close-btn {
      position: absolute;
      right: 0;
      top: 0;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 1;          
    }
    .close-btn img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.3s ease;             
    } 
    .close-btn:hover {
      opacity: 0.7; /* hover 效果，變透明一點 */
    }

    /* =========================
       RWD
    ========================= */

    @media (max-width: 380px) {

      .queue-page {
        padding-left: 12px;
        padding-right: 12px;
      }

      .queue-name {
        gap: 5px;
      }

      .queue-button {
        width: min(120px, 45vw);
      }

      .info-label {
        font-size: 11px;
      }

      .info-value {
        font-size: 19px;
      }

      .notice {
        font-size: 8px;
      }
    }
    @media (max-height: 600px) {

      .queue-page {
        padding-top: 6px;
        padding-bottom: 6px;
      }

      .page-title {
        margin: 2px 0;
        padding-bottom: 4px;
        font-size: 18px;
      }

      .queue-item {
        padding: 4px 0;
      }

      .queue-name {
        margin-bottom: 5px;
      }

      .queue-name .name-cn {
        font-size: 20px;
      }

      .queue-name .name-en {
        font-size: 15px;
      }

      .queue-button {
        height: 38px;
        margin-bottom: 5px;
        font-size: 20px;
      }

      .info-label {
        font-size: 10px;
      }

      .info-value {
        font-size: 18px;
      }

      .notice {
        font-size: 8px;
        line-height: 1.3;
      }
    }
    /* 橫版設計 */   
    /* 橫版css待修 */
    @media  (max-height: 568px)and (orientation: landscape){
      .queue-page {
        max-width: 100vw;
      }
      .queue-section {
        width: 100%;
        max-width: 90vw;
        /* max-width: 430px; */
        /* height: 100dvh; */
        max-height: 100dvh;
        /* padding: 12px 20px; */
        position: relative;
        display: grid;
        /* grid-template-rows:*/
        grid-template-columns:
          1fr
          1fr
          1fr;
        grid-template-rows:none;  
        overflow: hidden;
      }
      .queue-button-group{
        gap: 1vw;
      }   
      .queue-item {
        border-right: 1px solid #e5e5e5;
        border-bottom: none;
        display: flex;
        justify-content: space-evenly;
      }   
      .queue-item:last-of-type {
        border-right: none;
      }
      .queue-label{
        width: min(90px, 15vw);
        height: clamp(42px, 7vh, 56px);
        margin: 0 auto clamp(8px, 2vh, 20px);
      }
      .queue-button {
        display: block;
        width: min(90px, 15vw);
        height: clamp(42px, 7vh, 56px);
        margin: 0 auto clamp(8px, 2vh, 20px);
      }
      .queue-info {
        display: flex;

        justify-content: center;
        align-items: baseline;

        width: 100%;

        flex-shrink: 0;
      }
      .info-block {
        width: 48%;
      }
    }
  </style>
</head>

  <script>
    // let initData={
    //     caller_id: null,								// 叫號機 id
    //     hardware: null,									// 有無實體取號機 (true/fasle).
    //     caller_name: null, 
    //     curr_num: null,                 // 目前號碼
    //     support_get_num: null,          // 支援取號 (true/false)
    //     last_get_num: null,             // 最後取號 (若不支援取號服務，此欄為"")
    //     get_num_switch: null,           // 取號開關 ("on"/"off") (若不支援取號服務，此欄為"")
    //     get_num_item_type:null,         // 取號項目型別 (若不支援"選擇取號項目", 此欄為"")
    //     get_num_item_data: null,		    //(取號項目號碼資料)(用來取代 get_num_item_queue)
    //     get_num_item_names: null, 	    // 取號項目名稱
    //     get_num_item_queue: null,       // 取號項目號碼佇列
    //     get_num_notes: null,            // 取號需知 (若不顯示取號需知，此欄設為"")(若不支援取號服務，此欄為"")
    //     support_reserve_num: null,      // 支援到號保留 (true/false)(若不支援取號服務，此欄為false)
    //     reserve_time_limit: null, 			//(到號保留期限)
    //     reset_time:null,								//(重置時間)
    //     uuid: null // 封包識別碼"support_get_num"(支援取號)
    // };   
    let wsList = {};
    let initData = {};
    let userData = {};
		let wsHandler={};
		let storeData={};   
		const itemStatus={
			NONE: 0,
			NORMAL: 1,
			CLICKED: 2,
			CALLING: 3,
			RESERVED: 4,
			INVALID: 5,
			UNRESERVE: 6,
			REMOVE: 7  
    };     
    let userID = generateUserId();
    //let nowUserGetNumTime=null;
    let prefixData=[];
    let webGetNumCheck = [];

    const defTime = 600000;
    //const defTime = 1000*60;
    const versionMeta = document.querySelector('meta[name="version"]');
    const version = versionMeta ? versionMeta.getAttribute('content') : '未知版本';
    document.getElementById('ver').innerText = "ver."+version;
    //document.querySelector('.container').classList.add('hidden');
    const urlParams = new URLSearchParams(window.location.search);
    const usersParam = urlParams.get('users'); // 例如 ?users=shoe,scarf,hat
    //const clientIds = usersParam ? usersParam.split(',') : ['clientA','clientB','clientC']; 
    const clientIds = usersParam ? usersParam.split(',') : ['v010j','v010m','v0138']; 
    // 動態建立 section
    const middleContainer = document.getElementById('sectionContainer');
    clientIds.forEach((id, idx) => {
      const label = String.fromCharCode(65 + idx); // A, B, C...
      let section = addSection(label);
      middleContainer.appendChild(section);
      // 初始化 userData
      userData[`clientId${label}`] = { getnum:null, timestamp:null, turn: null, itemId: null };
    });
    function addSection(label){
      let queueSection = document.createElement('section');
      queueSection.className = 'queue-item';
      // 新增標題
      const title = document.createElement("div");
      title.className = 'queue-name';
      const title_cn = document.createElement("span");
      title_cn.className = 'name-cn';
      title_cn.id = `caller_name_${label}`;
      const title_en = document.createElement("span");
      title_en.className = 'name-en';
      title_en.id = `caller_name_s_${label}`;
      title.appendChild(title_cn);
      title.appendChild(title_en);
      queueSection.appendChild(title);

      const btnDisp = document.createElement("div");
      btnDisp.className = "queue-button-group";
      const queuelabel = document.createElement("div");
      queuelabel.className = "queue-label";
      queuelabel.id = `get_num_${label}`;;

      const btn = document.createElement("button");
      btn.className = "queue-button available"; // 💡 建議加上原本的 available class
      btn.id = `btn_${label}`;
      btn.textContent = '取號';
      btn.locked = false;
      btn.onclick = () =>getNumber(btn, `${label}`);
      btnDisp.appendChild(queuelabel);
      btnDisp.appendChild(btn);
      queueSection.appendChild(btnDisp);

      const info = document.createElement('div');
      info.className = "queue-info";
      const infoblock1 = document.createElement('div');
      infoblock1.className="info-block";
      const l11 = document.createElement('span');
      l11.className="info-label";
      l11.textContent = '目前服務號碼';
      const l11val = document.createElement('span');
      l11val.id = `curr_num_${label}`;
      l11val.className="info-value";
      l11val.textContent="---";
      infoblock1.appendChild(l11);
      infoblock1.appendChild(l11val);
      info.appendChild(infoblock1);

      const infoblock2 = document.createElement('div');
      infoblock2.className="info-block";
      const l21 = document.createElement('span');
      l21.className="info-label";
      l21.textContent = '等候組數';
      const l21val = document.createElement('span');
      l21val.id = `waiting_${label}`;
      l21val.className="info-value";
      l21val.textContent="---";
      infoblock2.appendChild(l21);
      infoblock2.appendChild(l21val);
      info.appendChild(infoblock2);      
      queueSection.appendChild(info);
      return queueSection;
    }

    
    // 取出 localforage 資料
    function getDBata () {
      try {
        const db = localforage.createInstance({
          name: 'callMe2',
          storeName: 'data'
        });

        // 先取 UserID
        db.getItem('UserID').then((data)=>{
          if(data){
            userID = data;
          }else{
            userID = generateUserId();  //產生新的
          }
        });

        // 再取每個 clientId 的資料
        Promise.all(clientIds.map(id => db.getItem(id))).then((dataList)=>{
          dataList.forEach((data, idx)=>{
            const label = String.fromCharCode(65 + idx); // A, B, C ...
            if(data){
              if(data.timestamp !== undefined && data.timestamp !== null){
                userData[`clientId${label}`].timestamp = data.timestamp;
                //userData[`clientId${label}`].timestamp = new Date(data.timestamp);
              }
              if(data.getnum !== undefined && data.getnum !== null){
                userData[`clientId${label}`].getnum = data.getnum;
              }

    function isCrossDayAndAfter4AM(startTime, now) {
      const isCrossDay = now.toDateString() !== startTime.toDateString();
      const fourAM = new Date();
      fourAM.setHours(4, 0, 0, 0);
      return isCrossDay && now.getTime() >= fourAM.getTime();
    }

    //✅ Step 1：先「標準化」你那種混合格式封包.
    function normalizeMessage(data){

        // MyWebSocketLow 有時回傳 array
        if(Array.isArray(data)){
            return {
                type: data[data.length-1],
                payload: data
            };
        }

        // JSON 格式
        if(typeof data === "object"){
            return {
                type: data.action,
                payload: data
            };
        }

        console.warn("Unknown WS message", data);
        return null;
    }

      const ws = new window.MyWebSocketLow('wss://cmb-caller-frontend-410240967190.asia-east1.run.app/');

      // };
      ws.onmessage = (data) => {
        //console.log('[WebSocket 收到回傳資料]', data);
        const msg = normalizeMessage(data);
        if(msg){
          wsHandler[label].handleMessage(msg);
        }
        let len = data.length;
        if(len > 1){
          const cmd = data[data.length - 1];
          if (cmd && cmd.toLowerCase() === 'auth') {
            const state = data[0];
            if (state === 'OK') {
              //console.log('驗證通過');
              agentName = data[1];
            } else {

                //console.log('驗證失敗');

            }
          }else if(cmd === 'update'){
            handleWebSocketMessageCSV(data, label);
          }
        }else{
          handleWebSocketMessage(data, label);
      
        }
      };
      ws.onclose = () => {
        console.warn(`[${label}] WebSocket 關閉，嘗試重連`);
        setTimeout(() => createWebSocket(callerId, label), 3000);

            ? _InternalSecurityModule

    function reCntWaitting(label, num, state){
      let obj = initData[label].get_num_item_data[num];
      let getnumObj={
        called_time: '', 
        for_customer: true, 
        get_num_item_id: '0',
        state: ''
      };
      if(!obj){
        getnumObj.state = state;
      }else{
        getnumObj.called_time = obj.called_time;
        getnumObj.for_customer = obj.for_customer;
        getnumObj.get_num_item_id = obj.get_num_item_id;
        if(state === 'waiting'){
          //getnumObj.called_time = new Date().getTime();
          getnumObj.called_time = '';
        }
        getnumObj.state = state;
      }
      initData[label].get_num_item_data[num] = getnumObj;


      let itemgroup = wsHandler[label].store.get('data.itemGroup');
      let usergetnum = userData[`clientId${label}`];  
      if(usergetnum && usergetnum.getnum !== null){
        let cnt = countWaiting(itemgroup, usergetnum);
        const displayLess = document.getElementById(`waiting_${label}`);
        displayLess.textContent = cnt;
      }
    }

    function resetData(label){
      initData[label].curr_num = 0;
      initData[label].call_num = 0;
      initData[label].last_get_num = 0;
      initData[label].get_num_item_data = {};
      initData[label].get_num_item_queue = [""];

      userData[`clientId${label}`].turn = "";
      userData[`clientId${label}`].itemId = "";

      try {
        const db = localforage.createInstance({
          name: 'callMe2',
          storeName: 'data'
        });
        const callerId = clientIds[label.charCodeAt(0)-65];
        db.removeItem(callerId);
      } catch (error) {
        console.error(error);
      }
      const curr_num = document.getElementById(`curr_num_${label}`);
      const waiting = document.getElementById(`waiting_${label}`);
      let btn = document.getElementById(`btn_${label}`);
      const get_num = document.getElementById(`get_num_${label}`);
      const caller_num_limit = initData[label].caller_num_limit;
      curr_num.textContent = prefixNumberString(0,caller_num_limit,prefixData[label].prefixMap,prefixData[label].prefixFlag);    
      waiting.textContent = 0;
      get_num.textContent = "";

      btn.disabled = false;
      btn.textContent = '取號';
      if(btn.classList.contains('disabled')){
        btn.classList.remove("disabled");
      }
      if(!btn.classList.contains('available')){
        btn.classList.add("available");
      }      
    }

    function generateUserId() {
      return 'xxxxxxxxyxxx'.replace(/[xy]/g, function (c) {
        const r = Math.random() * 16 | 0;
        return r.toString(16);

    function getNumber(btn, label){
      if(btn.disabled) return;
      if(initData[label]?.support_get_num === false || initData[label]?.get_num_switch === 'off'){

        return;
      }
      if(btn.locked === true){
        return;
      }
      const ws = wsList[label];
      const callerId = clientIds[label.charCodeAt(0) - 65];
      const get_num = document.getElementById(`get_num_${label}`);
      btn.locked = true;
      get_num.textContent="";
      
      if(!initData[label].get_num_item_type || initData[label].get_num_item_type === ""){
        //無分組.
        sendGetNum(ws, callerId, label, "");  
      }else{
        //有分組, 固定一組.
        sendGetNum(ws, callerId, label, "0");
      }
    }

    function popMsg(label, errorMsg=""){
      let modalbox = document.getElementById('modalOverlay');
      let mTitle = document.getElementById('mTitle');
      let mTitle_s = document.getElementById('mTitle_s');
      let mErrMsg = document.getElementById('errorMsg');
      let storename = initData[label].caller_name || "";
      let callername = null;
      if(initData[label].caller_name.indexOf(';;') !== -1){
          let str2=initData[label].caller_name.split(';;');
          storename = str2[0];
          callername = str2[1];
      }    
      mTitle_s.textContent ="";     
      if(callername !== null){
        mTitle.textContent = storename;
        mTitle_s.textContent = '['+callername+']';
      }else{
        mTitle.textContent = storename;

        // 找到第一個空格的位置
        let firstSpaceIndex = storename.indexOf(' ');
        if (firstSpaceIndex !== -1) {
          // 切出第一個空格前的內容
          let mTitle_cn = storename.slice(0, firstSpaceIndex).trim(); 
          
          // 切出第一個空格後「剩下全拿」的內容
          let mTitle_en = storename.slice(firstSpaceIndex + 1).trim(); 
          
          //console.log('中文:', mTitle_cn); // '飾品'
          //console.log('英文:', mTitle_en); // 'Fashion Acc.'
          mTitle.textContent = mTitle_cn;
          mTitle_s.textContent = mTitle_en;          
        }        
      }

      if(!modalbox.classList.contains('active')){
        modalbox.classList.add('active');
      }
      if(errorMsg !== ""){
        mErrMsg.textContent = errorMsg;
      }else{
        mErrMsg.textContent = '因人潮眾多 暫停取號\n請稍後重試';
      }
    }
    function closeModal(){
      let modalbox = document.getElementById('modalOverlay');
      if(modalbox.classList.contains('active')){
        modalbox.classList.remove('active');
      }
    }

    function modifyMiddleContainer(){
      let middle = document.getElementById('sectionContainer');
      if(middle){
        if(clientIds.length>=3){
          if(window.innerWidth > window.innerHeight){
            if(!middle.classList.contains('landscapeScreenOverlay')){
              middle.classList.add('landscapeScreenOverlay');
            }
          }else{
            if(middle.classList.contains('landscapeScreenOverlay')){
              middle.classList.remove('landscapeScreenOverlay');
            }
          }
        }
      }
